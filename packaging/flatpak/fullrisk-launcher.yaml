app-id: gg.norisk.NoRiskClientLauncherV3

runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk

command: fullrisk-launcher

finish-args:
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: fullrisk-launcher
    buildsystem: simple
    build-commands:
      - cp -a appimage-root/. /app/
      - install -D /app/usr/share/applications/gg.norisk.NoRiskClientLauncherV3.desktop /app/share/applications/gg.norisk.NoRiskClientLauncherV3.desktop
      - cp -a /app/usr/share/icons/. /app/share/icons/
      - |
        mkdir -p /app/bin
        printf '#!/bin/sh\nexec /app/AppRun "$@"\n' > /app/bin/fullrisk-launcher
        chmod 755 /app/bin/fullrisk-launcher
    sources:
      - type: dir
        path: sources/appimage-root
