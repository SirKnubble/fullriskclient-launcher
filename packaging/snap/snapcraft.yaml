name: fullrisk-launcher
base: core24
version: "0.6.29"
summary: FullRiskClient Launcher
description: |
  FullRiskClient Launcher built from the NoRiskClient/FullRiskClient launcher repository.
grade: stable
confinement: strict

apps:
  fullrisk-launcher:
    command: bin/fullrisk-launcher
    plugs: [desktop, desktop-legacy, x11, wayland, network, network-bind, home, opengl, browser-support]
    desktop: gg.norisk.NoRiskClientLauncherV3.desktop

parts:
  fullrisk-launcher:
    plugin: dump
    source: appimage-root
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
      - librsvg2-2
    override-build: |
      craftctl default
      mkdir -p "$CRAFT_PART_INSTALL/bin"
      printf '#!/bin/sh\nexec "$SNAP/AppRun" "$@"\n' > "$CRAFT_PART_INSTALL/bin/fullrisk-launcher"
      chmod 755 "$CRAFT_PART_INSTALL/bin/fullrisk-launcher"
