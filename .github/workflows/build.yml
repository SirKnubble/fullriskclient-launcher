name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux
          - macos-arm64
          - macos-x86_64
      release_tag:
        description: Release tag to upload to (empty = latest release)
        required: false
        type: string
      upload_to_release:
        description: Upload artifacts to the selected/latest release
        required: true
        default: true
        type: boolean

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: matrix
        shell: bash
        run: |
          windows='{"name":"windows","os":"windows-latest","platform":"windows-latest","target":"","args":"","output_path":"./src-tauri/target/release/bundle","asset_name_base":"NoRiskClient-Windows-setup","artifact_name":"NoRiskClient-Windows","artifact_paths":"src-tauri/target/release/bundle/nsis/*.exe\nsrc-tauri/target/release/bundle/nsis/*.exe.sig"}'
          linux='{"name":"linux","os":"ubuntu-22.04","platform":"ubuntu-22.04","target":"","args":"","output_path":"./src-tauri/target/release/bundle","asset_name_base":"NoRiskClient-Linux","artifact_name":"NoRiskClient-Linux","artifact_paths":"src-tauri/target/release/bundle/appimage/*.AppImage\nsrc-tauri/target/release/bundle/appimage/*.AppImage.sig\nsrc-tauri/target/release/bundle/appimage/*.AppImage.tar.gz\nsrc-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig\nsrc-tauri/target/release/bundle/deb/*.deb\nsrc-tauri/target/release/bundle/deb/*.deb.sig\nsrc-tauri/target/release/bundle/deb/*.deb.tar.gz\nsrc-tauri/target/release/bundle/deb/*.deb.tar.gz.sig\nsrc-tauri/target/release/bundle/rpm/*.rpm\nsrc-tauri/target/release/bundle/rpm/*.rpm.sig\nsrc-tauri/target/release/bundle/rpm/*.rpm.tar.gz\nsrc-tauri/target/release/bundle/rpm/*.rpm.tar.gz.sig\nsrc-tauri/target/release/bundle/snap/*.snap\nsrc-tauri/target/release/bundle/flatpak/*.flatpak\nsrc-tauri/target/release/bundle/aur/*.pkg.tar.*"}'
          macos_arm64='{"name":"macos-arm64","os":"macos-latest","platform":"macos-latest","target":"aarch64-apple-darwin","args":"--target aarch64-apple-darwin","output_path":"./src-tauri/target/aarch64-apple-darwin/release/bundle","asset_name_base":"NoRiskClient-MacOS-arm64","artifact_name":"NoRiskClient-MacOS-arm64","artifact_paths":"src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg\nsrc-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg.sig\nsrc-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz\nsrc-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig"}'
          macos_x86_64='{"name":"macos-x86_64","os":"macos-latest","platform":"macos-latest","target":"x86_64-apple-darwin","args":"--target x86_64-apple-darwin","output_path":"./src-tauri/target/x86_64-apple-darwin/release/bundle","asset_name_base":"NoRiskClient-MacOS-x86_64","artifact_name":"NoRiskClient-MacOS-x86_64","artifact_paths":"src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg\nsrc-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg.sig\nsrc-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz\nsrc-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig"}'

          platform="${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}"

          case "$platform" in
            windows)
              matrix="{\"include\":[$windows]}"
              ;;
            linux)
              matrix="{\"include\":[$linux]}"
              ;;
            macos-arm64)
              matrix="{\"include\":[$macos_arm64]}"
              ;;
            macos-x86_64)
              matrix="{\"include\":[$macos_x86_64]}"
              ;;
            all)
              matrix="{\"include\":[$windows,$linux,$macos_arm64,$macos_x86_64]}"
              ;;
            *)
              echo "Unknown platform: $platform" >&2
              exit 1
              ;;
          esac

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # --- JOB 0: Rust tests ---
  test:
    runs-on: ubuntu-22.04
    # cargo test executes every dependency's build.rs, so this job must not hold a
    # write-scoped token — actions/checkout persists it into .git/config.
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: cargo test
        working-directory: ./src-tauri
        run: cargo test --workspace

  # --- JOB 0b: compile the macOS 26 app icon ---
  # actool only understands Icon Composer .icon documents when it comes from
  # Xcode 26, which macos-latest does not carry yet. Compiling here keeps
  # NoRiskLauncher.icon as the single source of truth and keeps the rest of the
  # matrix on macos-latest.
  macos-icon:
    needs: test
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The very script contributors run locally, so the two can never drift.
      # It finds its own Xcode 26, verifies the catalog carries the bolt, and
      # writes src-tauri/Assets.car over the committed copy.
      - name: Compile Assets.car from NoRiskLauncher.icon
        run: bash src-tauri/icons/build-macos-icon.sh

      - name: Upload the compiled catalog
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets-car
          path: ./src-tauri/Assets.car
          if-no-files-found: error
          retention-days: 1

  # --- JOB 1: Build & Rename ---
  build:
    name: Build ${{ matrix.name }}
    needs: [prepare, test, macos-icon]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    env:
      WINDOWS_LAUNCHER_EXE: ${{ github.workspace }}\src-tauri\target\release\noriskclient-launcher-v3.exe
      CAPTURE_RUNTIME_ASSET: NoRiskClient-Windows-capture-runtime.zip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Replaces the committed placeholder with the catalog built from
      # NoRiskLauncher.icon, so the shipped icon always matches the .icon source.
      - name: Fetch the compiled macOS icon catalog
        if: matrix.platform == 'macos-latest'
        uses: actions/download-artifact@v4
        with:
          name: macos-assets-car
          path: ./src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm flatpak flatpak-builder libfuse2
          sudo apt-get install -y snapcraft

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - name: Install Rust stable
        if: matrix.target == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with target
        if: matrix.target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Set app version from release tag
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const configPath = "src-tauri/tauri.conf.json";
          const rawVersion = process.env.RELEASE_TAG.replace(/^v/i, "");

          let tauriVersion = rawVersion;
          if (/[a-z]/i.test(rawVersion)) {
            const base = rawVersion.split("-")[0];
            const build = Number(process.env.GITHUB_RUN_NUMBER) % 65535 || 1;
            tauriVersion = `${base}-${build}`;
          }

          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
          config.version = tauriVersion;
          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);

          console.log(`Release tag: ${rawVersion}`);
          console.log(`MSI-safe Tauri version: ${tauriVersion}`);
          NODE

      - name: Stage the capture runtime
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        run: yarn native-deps && yarn stage-native

      - name: Pack the capture runtime
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $outDir = Join-Path $env:RUNNER_TEMP "capture-runtime"
          yarn pack-capture-runtime --out $outDir
          if ($LASTEXITCODE -ne 0) { throw "packing the capture runtime failed" }
          $zip = Join-Path $outDir $env:CAPTURE_RUNTIME_ASSET
          $hash = (Get-Content "$zip.sha256" -Raw).Trim()
          if ($hash -notmatch '^[0-9a-f]{64}$') { throw "the capture runtime hash is not a SHA256 digest: '$hash'" }

          echo "CAPTURE_RUNTIME_ZIP=$zip" >> $env:GITHUB_ENV
          echo "NRC_CAPTURE_RUNTIME_SHA256=$hash" >> $env:GITHUB_ENV
          echo "NRC_CAPTURE_RUNTIME_URL=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$env:CAPTURE_RUNTIME_ASSET" >> $env:GITHUB_ENV

      - name: Stage the macOS capture engine
        if: matrix.platform == 'macos-latest'
        run: node scripts/stage-native-deps.mjs --target ${{ matrix.target }}

      - name: Build the Windows app
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        run: yarn tauri build --verbose --no-bundle

      - name: Verify the launcher carries the capture runtime hash
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes($env:WINDOWS_LAUNCHER_EXE)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $text.Contains($env:NRC_CAPTURE_RUNTIME_SHA256)) {
            throw "the launcher was built without the current capture runtime hash; a cached build must have been reused"
          }
          $hash = (Get-FileHash -Algorithm SHA256 $env:WINDOWS_LAUNCHER_EXE).Hash
          echo "WINDOWS_LAUNCHER_SHA256=$hash" >> $env:GITHUB_ENV
          Write-Host "launcher carries capture runtime $env:NRC_CAPTURE_RUNTIME_SHA256"

      - name: Bundle the Windows app
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: yarn tauri bundle --verbose

      # Tauri Action now handles build and sign
      - name: Build and Sign Tauri App
        if: ${{ !(matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')) }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          RUSTFLAGS: ${{ matrix.platform == 'ubuntu-22.04' && '-C link-arg=-Wl,--no-as-needed -C link-arg=-layatana-appindicator3 -C link-arg=-Wl,--as-needed' || '' }}
        with:
          args: --verbose ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
          packageManager: yarn

      - name: Fix AppImage (Remove Wayland libs & Resign)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          set -e
          bundle_dir="$(pwd)/${{ matrix.output_path }}/appimage"
          cd "$bundle_dir"
          appimage="$(ls *.AppImage | head -n 1)"

          chmod +x "$appimage"
          ./"$appimage" --appimage-extract > /dev/null
          find squashfs-root -name "*wayland*" -delete

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          export ARCH=x86_64
          ./appimagetool-x86_64.AppImage squashfs-root/ "$appimage"

          cd - > /dev/null
          yarn tauri signer sign "$bundle_dir/$appimage"
          cd "$bundle_dir"
          rm -rf squashfs-root appimagetool-x86_64.AppImage

      - name: Verify the launcher and stage the capture runtime
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 $env:WINDOWS_LAUNCHER_EXE).Hash
          if ($hash -ne $env:WINDOWS_LAUNCHER_SHA256) {
            throw "the launcher changed after build (expected $env:WINDOWS_LAUNCHER_SHA256, got $hash)"
          }
          Write-Host "launcher unchanged after build"

          $zipHash = (Get-FileHash -Algorithm SHA256 $env:CAPTURE_RUNTIME_ZIP).Hash.ToLower()
          if ($zipHash -ne $env:NRC_CAPTURE_RUNTIME_SHA256) {
            throw "the capture runtime archive changed after its hash was compiled in"
          }
          Copy-Item $env:CAPTURE_RUNTIME_ZIP "${{ matrix.output_path }}\nsis\"
          Write-Host "capture runtime $env:CAPTURE_RUNTIME_ASSET ($zipHash) staged for upload"

      - name: Detect AppImage (Linux only)
        continue-on-error: true
        if: matrix.os == 'ubuntu-22.04'
        id: appimage
        shell: bash
        run: |
          set -e
              
          FILE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -n 1 || true)
              
          if [[ -z "$FILE" ]]; then
            echo "No AppImage (expected on Linux only)"
            exit 1
          fi
              
          echo "file=$FILE" >> $GITHUB_OUTPUT
      - name: Setup Flatpak
        continue-on-error: true
        if: matrix.os == 'ubuntu-22.04'
        run: |
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

          flatpak --user install -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Prepare Flatpak input
        continue-on-error: true
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -e
          mkdir -p packaging/flatpak/sources
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -n 1)
          echo "Detected:"
          echo "$APPIMAGE"
          cp "$APPIMAGE" packaging/flatpak/sources/app.AppImage
          echo "Flatpak sources:"
          ls -lah packaging/flatpak/sources

      - name: Build Flatpak
        continue-on-error: true
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -e
              
          flatpak-builder --user --force-clean \
            --repo=packaging/flatpak/repo \
            packaging/flatpak/build-dir \
            packaging/flatpak/fullrisk-launcher.yaml

      - name: Prepare Snap
        continue-on-error: true
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -e

          mkdir -p packaging/snap

          cp "${{ steps.appimage.outputs.file }}" packaging/snap/app.AppImage

          sudo apt-get update
          sudo apt-get install -y squashfs-tools

          sudo systemctl restart snapd || true

      - name: Build Snap
        if: matrix.os == 'ubuntu-22.04'
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            ubuntu:24.04 \
            bash -c "
              apt update
              apt install -y snapcraft
              cd /workspace/packaging/snap
              snapcraft pack --destructive-mode
            "

      - name: Determine RPM version
        id: rpm_version
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
              
          BASE="${VERSION%%-*}"
              
          RELEASE="1"
              
          if [[ "$VERSION" == *-* ]]; then
            RELEASE="${GITHUB_RUN_NUMBER}"
          fi
              
          echo "base=$BASE" >> $GITHUB_OUTPUT
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
      - name: Build RPM package
        if: matrix.os == 'ubuntu-22.04'
        continue-on-error: true
        run: |
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS,tmp}

          VERSION="${{ steps.rpm_version.outputs.base }}"
          RELEASE="${{ steps.rpm_version.outputs.release }}"

          sed \
            -e "s/@VERSION@/$VERSION/g" \
            -e "s/@RELEASE@/$RELEASE/g" \
            packaging/rpm/FullriskLauncher.spec.template \
            > packaging/rpm/FullriskLauncher.spec

          git archive \
            --format=tar.gz \
            --prefix=fullrisk-launcher-${VERSION}/ \
            HEAD \
            > rpmbuild/SOURCES/fullrisk-launcher-${VERSION}.tar.gz

          rpmbuild \
            --define "_topdir $(pwd)/rpmbuild" \
            -ba packaging/rpm/FullriskLauncher.spec

          mkdir -p src-tauri/target/release/bundle/rpm

          cp rpmbuild/RPMS/*/*.rpm \
             src-tauri/target/release/bundle/rpm/

      - name: Build AUR package
        continue-on-error: true
        if: matrix.os == 'ubuntu-22.04'
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          SAFE_VERSION="${VERSION//-/_}"

          mkdir -p src-tauri/target/release/bundle/aur

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            archlinux:latest \
            /bin/bash -lc "

            pacman -Sy --noconfirm \
              archlinux-keyring \
              base-devel \
              git \
              nodejs \
              npm \
              yarn \
              rust \
              cargo \
              webkit2gtk-4.1 \
              libayatana-appindicator \
              librsvg \
              patchelf \
              fakeroot \
              debugedit

            useradd -m builder

            chown -R builder:builder /work

            su builder -c '
              cd /work/packaging/aur

              sed -i \"s/pkgver=.*/pkgver=${SAFE_VERSION}/\" PKGBUILD

              makepkg -s --noconfirm

              cp *.pkg.tar.* /work/src-tauri/target/release/bundle/aur/
            '
          "
      - name: Fix Linux artifact permissions
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo chown -R $USER:$USER src-tauri/target || true
          chmod -R u+rw src-tauri/target || true
      - name: Rename artifacts
        shell: bash
        run: |
          shopt -s nullglob
          platform="${{ matrix.name }}"

          while IFS= read -r pattern; do
            [[ -z "$pattern" ]] && continue

            for file in $pattern; do
              dir="$(dirname "$file")"
              name="$(basename "$file")"

              case "$platform:$name" in
                windows:*.exe)
                  renamed="FullriskLauncher-Windows-Setup.exe"
                  ;;
                linux:*.AppImage.tar.gz)
                  renamed="FullriskLauncher-Linux.AppImage.tar.gz"
                  ;;
                linux:*.AppImage)
                  renamed="FullriskLauncher-Linux.AppImage"
                  ;;
                linux:*.deb.tar.gz)
                  renamed="FullriskLauncher-Linux.deb.tar.gz"
                  ;;
                linux:*.deb)
                  renamed="FullriskLauncher-Linux.deb"
                  ;;
                linux:*.rpm)
                  renamed="FullriskLauncher-Linux.rpm"
                  ;;
                linux:*.snap)
                  renamed="FullriskLauncher-Linux.snap"
                  ;;
                linux:*.flatpak)
                  renamed="FullriskLauncher-Linux.flatpak"
                  ;;
                linux:*.pkg.tar.*)
                  suffix="${name##*.pkg.tar.}"
                  renamed="FullriskLauncher-Linux.pkg.tar.${suffix}"
                  ;;
                macos-arm64:*.dmg)
                  renamed="FullriskLauncher-macOS-arm64.dmg"
                  ;;
                macos-arm64:*.app.tar.gz)
                  renamed="FullriskLauncher-macOS-arm64.app.tar.gz"
                  ;;
                macos-x86_64:*.dmg)
                  renamed="FullriskLauncher-macOS-x86_64.dmg"
                  ;;
                macos-x86_64:*.app.tar.gz)
                  renamed="FullriskLauncher-macOS-x86_64.app.tar.gz"
                  ;;
                *)
                  renamed="${name//NoRisk Launcher/Fullrisk Launcher}"
                  renamed="${renamed//NoRiskClient/FullriskLauncher}"
                  ;;
              esac

              if [[ "$name" == *.sig ]]; then
                continue
              fi

              if [[ "$name" != "$renamed" ]]; then
                mv "$file" "$dir/$renamed"
                if [[ -f "$file.sig" ]]; then
                  mv "$file.sig" "$dir/$renamed.sig"
                fi
              fi
            done
          done <<< "${{ matrix.artifact_paths }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_paths }}
            ${{ matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/') && format('{0}/nsis/{1}', matrix.output_path, env.CAPTURE_RUNTIME_ASSET) || '' }}
          if-no-files-found: warn

  release:
    name: Upload release artifacts
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.upload_to_release)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -print

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${{ github.ref_name }}"

            if ! gh release view "$tag" >/dev/null 2>&1; then
              args=(gh release create "$tag" --title "Release $tag" --notes "Automated release for tag $tag.")

              if [[ "$tag" == *-alpha* || "$tag" == *-beta* || "$tag" == *-rc* ]]; then
                args+=(--prerelease)
              fi

              "${args[@]}"
            fi
          else
            tag="${{ inputs.release_tag }}"

            if [[ -z "$tag" ]]; then
              tag="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)"
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate updater manifest
        id: updater_manifest
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          UPDATE_ASSET_REPO: SirKnubble/fullriskclient-launcher
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const tag = process.env.RELEASE_TAG;
          const version = tag.replace(/^v/i, "");
          const channel = /(?:^|-)beta/i.test(version) ? "beta" : "stable";
          const assetRepo = process.env.UPDATE_ASSET_REPO;
          const artifactRoot = "artifacts";

          const mappings = [
            ["windows-x86_64", "FullriskLauncher-Windows-Setup.exe"],
            ["linux-x86_64", "FullriskLauncher-Linux.AppImage.tar.gz"],
            ["linux-x86_64", "FullriskLauncher-Linux.AppImage"],
            ["debian-x86_64", "FullriskLauncher-Linux.deb.tar.gz"],
            ["debian-x86_64", "FullriskLauncher-Linux.deb"],
            ["darwin-aarch64", "FullriskLauncher-macOS-arm64.app.tar.gz"],
            ["darwin-x86_64", "FullriskLauncher-macOS-x86_64.app.tar.gz"],
          ];

          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const fullPath = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(fullPath) : [fullPath];
            });
          }

          const files = walk(artifactRoot);
          const byName = new Map(files.map((file) => [path.basename(file), file]));
          const platforms = {};

          for (const [platformKey, assetName] of mappings) {
            if (platforms[platformKey]) continue;

            const artifact = byName.get(assetName);
            const signature = byName.get(`${assetName}.sig`);
            if (!artifact || !signature) continue;

            platforms[platformKey] = {
              url: `https://github.com/${assetRepo}/releases/download/${encodeURIComponent(tag)}/${encodeURIComponent(assetName)}`,
              signature: fs.readFileSync(signature, "utf8").trim(),
            };
          }

          if (Object.keys(platforms).length === 0) {
            throw new Error("No updater platform artifacts with .sig files were found.");
          }

          const manifest = {
            [channel]: {
              version,
              notes: `Automated release for tag ${tag}.`,
              pub_date: new Date().toISOString(),
              platforms,
            },
          };

          fs.mkdirSync("artifacts/_updater-manifest", { recursive: true });
          fs.writeFileSync(
            `artifacts/_updater-manifest/update-manifest-${channel}.json`,
            `${JSON.stringify(manifest, null, 2)}\n`,
          );

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `channel=${channel}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' files < <(find artifacts -type f -print0)

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No artifacts found to upload." >&2
            exit 1
          fi

          gh release upload "${{ steps.release.outputs.tag }}" "${files[@]}" --clobber

      - name: Deploy updater manifest to fullrisk.net
        if: github.event_name == 'push' || inputs.platform == 'all'
        env:
          FULLRISK_DEPLOY_HOST: ${{ secrets.FULLRISK_DEPLOY_HOST }}
          FULLRISK_DEPLOY_USER: ${{ secrets.FULLRISK_DEPLOY_USER }}
          FULLRISK_DEPLOY_SSH_KEY: ${{ secrets.FULLRISK_DEPLOY_SSH_KEY }}
          FULLRISK_UPDATE_MANIFEST_PATH: ${{ secrets.FULLRISK_UPDATE_MANIFEST_PATH }}
          FULLRISK_API_SERVICE: ${{ secrets.FULLRISK_API_SERVICE }}
          UPDATE_CHANNEL: ${{ steps.updater_manifest.outputs.channel }}
        shell: bash
        run: |
          if [[ -z "$FULLRISK_DEPLOY_HOST" || -z "$FULLRISK_DEPLOY_USER" || -z "$FULLRISK_DEPLOY_SSH_KEY" || -z "$FULLRISK_UPDATE_MANIFEST_PATH" ]]; then
            echo "Skipping updater manifest deploy because one or more FULLRISK_* deploy secrets are missing."
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$FULLRISK_DEPLOY_SSH_KEY" > ~/.ssh/fullrisk_deploy_key
          chmod 600 ~/.ssh/fullrisk_deploy_key

          remote="$FULLRISK_DEPLOY_USER@$FULLRISK_DEPLOY_HOST"
          ssh_opts=(-i ~/.ssh/fullrisk_deploy_key -o StrictHostKeyChecking=accept-new)

          ssh "${ssh_opts[@]}" "$remote" "mkdir -p \"\$(dirname \"$FULLRISK_UPDATE_MANIFEST_PATH\")\""
          ssh "${ssh_opts[@]}" "$remote" "test -f \"$FULLRISK_UPDATE_MANIFEST_PATH\" && cat \"$FULLRISK_UPDATE_MANIFEST_PATH\" || true" > existing-update-manifest.json

          node <<'NODE'
          const fs = require("node:fs");
          const channel = process.env.UPDATE_CHANNEL;
          const incoming = JSON.parse(fs.readFileSync(`artifacts/_updater-manifest/update-manifest-${channel}.json`, "utf8"));
          let existing = {};

          try {
            const raw = fs.readFileSync("existing-update-manifest.json", "utf8").trim();
            if (raw) existing = JSON.parse(raw);
          } catch {
            existing = {};
          }

          existing[channel] = incoming[channel];
          fs.writeFileSync("update-manifest-merged.json", `${JSON.stringify(existing, null, 2)}\n`);
          NODE

          scp "${ssh_opts[@]}" update-manifest-merged.json "$remote:$FULLRISK_UPDATE_MANIFEST_PATH"

          if [[ -n "$FULLRISK_API_SERVICE" ]]; then
            ssh "${ssh_opts[@]}" "$remote" "sudo systemctl restart \"$FULLRISK_API_SERVICE\""
          fi
